<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>SpendWise | Contas a Pagar</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FIREBASE -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100;300;400;500;600;700;800;900&display=swap');

        :root {
            --primary: #000000;
            --accent: #FF9500;
            --bg: #FFFFFF;
            --subtle: #F5F5F7;
            --text-main: #1D1D1F;
            --text-sub: #86868B;
            --success: #34C759;
            --danger: #FF3B30;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text-main);
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .soft-card {
            background: white;
            border-radius: 28px;
            border: 1px solid rgba(0, 0, 0, 0.04);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.04);
        }

        .clean-input {
            background: var(--subtle);
            border: 1px solid transparent;
            transition: 0.2s ease;
        }

        .clean-input:focus {
            outline: none;
            border-color: rgba(0, 0, 0, 0.1);
            background: white;
        }

        .btn-action {
            transition: 0.2s ease;
        }

        .btn-action:active {
            transform: scale(0.96);
        }

        .checkbox-custom {
            width: 24px;
            height: 24px;
            border-radius: 8px;
            border: 2px solid #D1D5DB;
            cursor: pointer;
            transition: 0.2s ease;
            flex-shrink: 0;
        }

        .checkbox-custom.checked {
            background: var(--accent);
            border-color: var(--accent);
            position: relative;
        }

        .checkbox-custom.checked::after {
            content: '✓';
            position: absolute;
            color: white;
            font-size: 13px;
            font-weight: bold;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .task-complete {
            opacity: 0.5;
            text-decoration: line-through;
        }

        .fade-in {
            animation: fade .2s ease;
        }

        @keyframes fade {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .empty-state {
            border: 2px dashed #E5E7EB;
        }

        #customConfirm {
            animation: fadeBg .2s ease;
        }

        @keyframes fadeBg {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }
    </style>
</head>

<body class="pb-10">

    <!-- MODAL EXCLUIR -->
    <div id="customConfirm"
        class="fixed inset-0 bg-black/40 backdrop-blur-sm hidden items-center justify-center z-50 px-5">

        <div class="soft-card p-6 w-full max-w-sm fade-in">

            <div class="flex items-center gap-3 mb-4">

                <div class="w-12 h-12 rounded-2xl bg-red-100 flex items-center justify-center">
                    <span class="text-red-500 text-xl font-black">!</span>
                </div>

                <div>
                    <h3 class="text-lg font-black tracking-tight">
                        Excluir item
                    </h3>

                    <p class="text-xs text-gray-400 mt-1">
                        Essa ação não poderá ser desfeita.
                    </p>
                </div>

            </div>

            <div class="flex gap-3 mt-6">

                <button onclick="closeConfirm()"
                    class="flex-1 bg-gray-100 text-gray-500 py-3 rounded-2xl text-[10px] font-bold uppercase tracking-widest btn-action">
                    Cancelar
                </button>

                <button id="confirmDeleteBtn"
                    class="flex-1 bg-orange-500 text-white py-3 rounded-2xl text-[10px] font-bold uppercase tracking-widest btn-action">
                    Excluir
                </button>

            </div>

        </div>

    </div>

    <div class="max-w-md mx-auto px-4 pt-6">

        <!-- HEADER -->
        <header class="flex justify-between items-center mb-6 px-2">

            <div>
                <h1 class="text-2xl font-black tracking-tighter">
                    SPENDWISE<span class="font-light text-orange-500">.PAY</span>
                </h1>

                <p class="text-[10px] uppercase tracking-[0.3em] text-gray-400 font-bold mt-1">
                    Checklist de pagamentos
                </p>
            </div>

            <div
                class="w-12 h-12 rounded-2xl bg-black text-white flex items-center justify-center shadow-sm font-black">
                $
            </div>

        </header>

        <!-- MENU -->
        <div class="flex gap-2 px-2 mb-6 overflow-x-auto">

            <button onclick="window.location.href='index.html'"
                class="flex-1 min-w-[100px] bg-gray-100 text-gray-500 py-3 rounded-2xl text-[10px] font-bold uppercase tracking-widest whitespace-nowrap">
                Gastos
            </button>

            <button onclick="window.location.href='contas-receber.html'"
                class="flex-1 min-w-[100px] bg-gray-100 text-gray-500 py-3 rounded-2xl text-[10px] font-bold uppercase tracking-widest whitespace-nowrap">
                Receber
            </button>

            <button
                class="flex-1 min-w-[100px] bg-orange-500 text-white py-3 rounded-2xl text-[10px] font-bold uppercase tracking-widest whitespace-nowrap">
                Pagar
            </button>

        </div>

        <!-- INPUT -->
        <section class="mb-8">

            <div class="soft-card p-6">

                <h2 class="text-xs uppercase tracking-[0.25em] text-gray-400 font-bold mb-5">
                    Adicionar pagamento
                </h2>

                <div class="flex gap-3">

                    <input type="text" id="paymentInput" placeholder="Ex: Conta de água"
                        class="flex-1 clean-input rounded-2xl p-4 text-sm font-semibold">

                    <button onclick="createPayment()"
                        class="bg-orange-500 text-white px-5 rounded-2xl text-[10px] font-bold uppercase tracking-[0.2em] btn-action">
                        Confirmar
                    </button>

                </div>

            </div>

        </section>

        <!-- LISTAGEM -->
        <section>

            <div class="flex items-center justify-between px-2 mb-5">

                <h2 class="text-xs uppercase tracking-[0.3em] text-gray-400 font-bold">
                    Pagamentos
                </h2>

                <p id="totalPayments" class="text-xs font-black">
                    0 itens
                </p>

            </div>

            <div id="paymentsContainer" class="space-y-4"></div>

        </section>

    </div>

    <script>

        // FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyCoQMsLBibpp14dILtemMuWBzTj_3mu2ZE",
            authDomain: "spendwise-a92b3.firebaseapp.com",
            projectId: "spendwise-a92b3",
            storageBucket: "spendwise-a92b3.firebasestorage.app",
            messagingSenderId: "64183948055",
            appId: "1:64183948055:web:da38ae8f595c8e87771d52"
        };

        firebase.initializeApp(firebaseConfig);

        const auth = firebase.auth();
        const db = firebase.firestore();

        let payments = [];
        let deleteId = null;

        // LOGIN
        auth.onAuthStateChanged(user => {

            if (!user) {
                window.location.href = "index.html";
                return;
            }

            startSync(user.uid);
        });

        // REALTIME
        function startSync(uid) {

            db.collection("paymentsChecklist")
                .where("userId", "==", uid)
                .onSnapshot(snapshot => {

                    payments = snapshot.docs.map(doc => ({
                        id: doc.id,
                        ...doc.data()
                    }));

                    payments.sort((a, b) => b.createdAt - a.createdAt);

                    renderPayments();

                });
        }

        // CRIAR
        async function createPayment() {

            const input = document.getElementById('paymentInput');

            const text = input.value.trim();

            if (!text) return;

            await db.collection("paymentsChecklist").add({
                userId: auth.currentUser.uid,
                text,
                checked: false,
                createdAt: Date.now()
            });

            input.value = '';
        }

        // TOGGLE
        async function togglePayment(id, checked) {

            await db.collection("paymentsChecklist")
                .doc(id)
                .update({
                    checked: !checked
                });
        }

        // EDITAR
        async function editPayment(id, currentText) {

            const newText = prompt('Editar pagamento:', currentText);

            if (newText === null) return;

            if (newText.trim() === '') return;

            await db.collection("paymentsChecklist")
                .doc(id)
                .update({
                    text: newText.trim()
                });
        }

        // MODAL
        function openConfirm(id) {

            deleteId = id;

            document
                .getElementById('customConfirm')
                .classList
                .remove('hidden');

            document
                .getElementById('customConfirm')
                .classList
                .add('flex');
        }

        function closeConfirm() {

            deleteId = null;

            document
                .getElementById('customConfirm')
                .classList
                .add('hidden');

            document
                .getElementById('customConfirm')
                .classList
                .remove('flex');
        }

        // CONFIRMAR DELETE
        document
            .getElementById('confirmDeleteBtn')
            .addEventListener('click', async () => {

                if (!deleteId) return;

                await db
                    .collection("paymentsChecklist")
                    .doc(deleteId)
                    .delete();

                closeConfirm();
            });

        // RENDER
        function renderPayments() {

            const container = document.getElementById('paymentsContainer');

            document.getElementById('totalPayments').innerText =
                `${payments.length} itens`;

            if (payments.length === 0) {

                container.innerHTML = `

                    <div class="soft-card empty-state p-10 text-center">

                        <p class="text-sm font-bold text-gray-400">
                            Nenhum pagamento criado
                        </p>

                        <p class="text-xs text-gray-400 mt-2">
                            Adicione um item acima para começar
                        </p>

                    </div>

                `;

                return;
            }

            container.innerHTML = '';

            payments.forEach(payment => {

                container.innerHTML += `

                    <div class="soft-card p-5 fade-in">

                        <div class="flex items-center justify-between gap-4">

                            <div class="flex items-center gap-4 flex-1 min-w-0">

                                <div 
                                    onclick="togglePayment('${payment.id}', ${payment.checked})"
                                    class="checkbox-custom ${payment.checked ? 'checked' : ''}">
                                </div>

                                <p 
                                    onclick="editPayment('${payment.id}', \`${payment.text.replace(/`/g, '\\`')}\`)"
                                    class="${payment.checked ? 'task-complete' : ''} text-sm font-semibold cursor-pointer break-words flex-1">
                                    ${payment.text}
                                </p>

                            </div>

                            <button
                                onclick="openConfirm('${payment.id}')"
                                class="text-[10px] font-black uppercase tracking-wider text-red-400 flex-shrink-0">
                                Excluir
                            </button>

                        </div>

                    </div>

                `;
            });
        }

        // ENTER
        document
            .getElementById('paymentInput')
            .addEventListener('keypress', function (e) {

                if (e.key === 'Enter') {
                    createPayment();
                }
            });

    </script>

</body>

</html>
